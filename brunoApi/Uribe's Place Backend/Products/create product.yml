info:
  name: create product
  type: http
  seq: 2

http:
  method: POST
  url: http://127.0.0.1:8000/api/products/create
  body:
    type: json
    data: |-
      {"productName" : "otra prueba",
       "productDescription" : "pruebita 2",
       "brand" : "prueba",
       "price" : 100.00,
       "idStore" : 1,
       "idProductQuality" : 1,
       "stock" : 5000,
       "SKU" : "PRU-EBA-002",
       "images" : [
         "data:image/png;base64,"
       ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
